name: Verify Current preversion

on:
  push:
    branches: [design/current-preversion]
    paths:
      - 'design-preversion/**'
      - '.github/workflows/current-preversion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-preversion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install existing browser-test dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify standalone pages and complete journeys
        run: node design-preversion/tests/verify.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: current-preversion-evidence
          path: current-preversion-evidence/
          retention-days: 14
      - name: Package Current preversion
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: JobSinton-current-preversion
          path: |
            design-preversion/
            !design-preversion/tests/
          retention-days: 30
