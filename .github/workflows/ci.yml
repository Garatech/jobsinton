name: Verify JobSinton

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify backend HTTP contract
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci
      - name: Check TypeScript and build frontend
        run: npm --prefix frontend run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify browser and API integration
        run: npm --prefix frontend run test:e2e
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-failure-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/target/surefire-reports/
          retention-days: 7

      - name: Preserve profile previews
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-previews
          path: frontend/test-results/**/profile.png
          retention-days: 7

      - name: Preserve Current interface previews
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: current-interface-previews
          path: frontend/test-results/**/current-*.png
          retention-days: 14
