name: Verify design previews

on:
  push:
    branches: [main, design/visual-exploration]
    paths:
      - 'design-exploration/**'
      - '.github/workflows/design-previews.yml'
  pull_request:
    branches: [main]
    paths:
      - 'design-exploration/**'
      - '.github/workflows/design-previews.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install existing browser-test dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify offline design previews
        run: node design-exploration/tests/verify.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: design-preview-evidence
          path: design-preview-evidence/
          retention-days: 14
      - name: Package design studies
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: JobSinton-designs
          path: |
            design-exploration/
            !design-exploration/tests/
          retention-days: 30
