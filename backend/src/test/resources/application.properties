spring.application.name=jobsinton
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# Keep automated @SpringBootTest runs 100% offline and deterministic with zero disk side effects.
jobsinton.ats.cache-ttl-seconds=600
jobsinton.ats.request-timeout-ms=8000
jobsinton.ats.max-concurrency=24
jobsinton.ats.smartrecruiters-detail-cap=6
jobsinton.ats.factorial-detail-cap=6
jobsinton.ats.seen-jobs-file=
jobsinton.ats.custom-companies-file=
jobsinton.ats.feed-cache-file=
jobsinton.ats.warm-on-startup=false
