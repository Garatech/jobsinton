spring.application.name=jobsinton
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# Multi-ATS direct provider defaults (9 public ATS platforms, zero API keys required).
jobsinton.ats.cache-ttl-seconds=600
jobsinton.ats.request-timeout-ms=8000
jobsinton.ats.max-concurrency=18
jobsinton.ats.smartrecruiters-detail-cap=6
jobsinton.ats.factorial-detail-cap=6
jobsinton.ats.custom-companies-file=data/custom-companies.json
jobsinton.ats.seen-jobs-file=data/ats-seen-jobs.json
